desktop:
  resolution:
    width: 1440
    height: 900
  allow_resize: true
  pixel_depth: 24

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 6901
  use_ipv4: true
  use_ipv6: false
  ssl:
    pem_certificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
    pem_key: /etc/ssl/private/ssl-cert-snakeoil.key
    require_ssl: true

user_session:
  new_session_disconnects_existing_exclusive_session: true
  concurrent_connections_prompt: false
  idle_timeout: never

security:
  brute_force_protection:
    blacklist_threshold: 5
    blacklist_timeout: 10

runtime_configuration:
  # Saved browser presets must not silently re-enable costly encoding.
  allow_client_to_override_kasm_server_settings: false

encoding:
  max_frame_rate: 15
  video_streaming_mode:
    # KasmVNC 1.5.0: an empty codec disables full-frame video streaming.
    # File management and terminals use changed rectangles instead of x265.
    codec: ""
  video_encoding_mode:
    # Fall back to JPEG as soon as WebP consumes measurable encoding time.
    webp_encoding_time: 0
    max_resolution:
      width: 1920
      height: 1080
  rect_encoding_mode:
    min_quality: 7
    max_quality: 8
    rectangle_compress_threads: 2

server:
  http:
    headers:
      - Cross-Origin-Embedder-Policy=require-corp
      - Cross-Origin-Opener-Policy=same-origin
      - Referrer-Policy=no-referrer
      - X-Content-Type-Options=nosniff
    httpd_directory: /usr/local/share/nodesktop/kasmvnc-www
